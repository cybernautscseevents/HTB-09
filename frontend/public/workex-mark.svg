<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="WORKEX voxel W logo">
  <defs>
    <filter id="green-edge" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#54df86" flood-opacity=".28" result="green"/>
      <feComposite in="green" in2="SourceAlpha" operator="in" result="edge"/>
      <feGaussianBlur in="edge" stdDeviation="2" result="soft-edge"/>
      <feMerge>
        <feMergeNode in="soft-edge"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <g id="stone-cube" shape-rendering="crispEdges">
      <path d="M0 2 2 0h8L8 2Z" fill="#68745b"/>
      <path d="M8 2 10 0v8L8 10Z" fill="#202a29"/>
      <path d="M0 2h8v8H0Z" fill="#414b47"/>
      <path d="M0 2h8v8H0Z" fill="none" stroke="#17211f" stroke-width=".7"/>
    </g>
  </defs>

  <circle cx="48" cy="48" r="45" fill="#0d151a" stroke="#315b43" stroke-width="2"/>

  <g filter="url(#green-edge)">
    <!-- Two thick outer stems and stepped diagonals form a more legible W at small sizes. -->
    <use href="#stone-cube" x="16" y="22"/>
    <use href="#stone-cube" x="64" y="22"/>
    <use href="#stone-cube" x="16" y="30"/>
    <use href="#stone-cube" x="64" y="30"/>
    <use href="#stone-cube" x="16" y="38"/>
    <use href="#stone-cube" x="40" y="38"/>
    <use href="#stone-cube" x="64" y="38"/>
    <use href="#stone-cube" x="16" y="46"/>
    <use href="#stone-cube" x="24" y="46"/>
    <use href="#stone-cube" x="40" y="46"/>
    <use href="#stone-cube" x="56" y="46"/>
    <use href="#stone-cube" x="64" y="46"/>
    <use href="#stone-cube" x="24" y="54"/>
    <use href="#stone-cube" x="32" y="54"/>
    <use href="#stone-cube" x="48" y="54"/>
    <use href="#stone-cube" x="56" y="54"/>
    <use href="#stone-cube" x="32" y="62"/>
    <use href="#stone-cube" x="48" y="62"/>
  </g>

  <g fill="#62d980" shape-rendering="crispEdges">
    <path d="m16 24 2-2h8l-2 2z"/>
    <path d="m64 24 2-2h8l-2 2z"/>
    <path d="m40 40 2-2h8l-2 2z"/>
    <path d="m24 48 2-2h8l-2 2z"/>
    <path d="m56 48 2-2h8l-2 2z"/>
    <path d="m32 56 2-2h8l-2 2z"/>
    <path d="m48 56 2-2h8l-2 2z"/>
  </g>
</svg>
